name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # rebuild weekly so the admin passcode table always reaches a year ahead
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  account-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node --test tools/tests/profiles.test.mjs tools/tests/cloud-save.test.cjs tools/tests/adventure.test.mjs tools/tests/materials.test.mjs tools/tests/expedition.test.mjs tools/tests/trader-ai.test.mjs tools/tests/weapons.test.mjs tools/tests/career.test.mjs
  build:
    needs: account-tests
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # our own relay (Cloudflare Worker) for players whose networks block peer to peer; skipped until the
      # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets exist, and a failure here never blocks the site
      - name: Deploy relay
        id: relay
        if: ${{ env.CF_TOKEN != '' }}
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_SEED: ${{ secrets.ADMIN_SEED }}
        run: |
          api=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain
          resp=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $api)
          sub=$(echo "$resp" | jq -r '.result.subdomain // empty')
          echo "::notice::subdomain lookup: $(echo "$resp" | jq -c '{success, errors}' | cut -c1-300) · account id length ${#CLOUDFLARE_ACCOUNT_ID}"
          if [ -z "$sub" ]; then
            # first time: give the account a workers.dev subdomain
            for name in tianque-$(echo $CLOUDFLARE_ACCOUNT_ID | cut -c1-6) tianque-$RANDOM$RANDOM; do
              resp=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "{\"subdomain\":\"$name\"}" $api)
              sub=$(echo "$resp" | jq -r '.result.subdomain // empty')
              echo "::notice::register $name: $(echo "$resp" | jq -c '{success, errors}' | cut -c1-300)"
              [ -n "$sub" ] && break
            done
          fi
          v=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "::notice::token check: $(echo "$v" | jq -c '{success, status: .result.status, errors}' | cut -c1-200) · token length ${#CLOUDFLARE_API_TOKEN}"
          # the account's workers.dev subdomain, as set in the dashboard (not a secret)
          [ -z "$sub" ] && sub=msjzxy2022
          # Server-side admin authentication uses only derived hashes, never the seed.
          node --input-type=module -e 'import {hashTable,ITER} from "./tools/admin-codes.mjs"; import {writeFileSync} from "node:fs"; writeFileSync("relay/src/admin-hashes.js", "export default " + JSON.stringify({iter:ITER,days:process.env.ADMIN_SEED ? hashTable(process.env.ADMIN_SEED) : {}}) + ";\n");'
          cd relay
          # 战绩 database: Cloudflare D1 (created the first time); needs the token's D1 permission. Without it the
          # stats fall back to a Durable Object's SQLite, so the deploy goes on either way.
          # (every step here may fail without stopping the relay deploy: bash -e would otherwise end the step)
          d1id() { npx --yes wrangler@4 d1 list --json 2>/dev/null | jq -r '.[]? | select(.name=="tianque-db") | .uuid' 2>/dev/null || true; }
          dbid=$(d1id || true)
          if [ -z "$dbid" ]; then
            npx --yes wrangler@4 d1 create tianque-db > ../d1.log 2>&1 || true
            dbid=$(d1id || true)
          fi
          if [ -n "$dbid" ]; then
            printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "tianque-db"\ndatabase_id = "%s"\n' "$dbid" >> wrangler.toml
            echo "::notice::stats database: D1 tianque-db"
          else
            echo "::warning::D1 not available ($(grep -m1 -i 'error\|permission\|auth' ../d1.log | cut -c1-160)); stats use Durable Object storage. Add the D1 Edit permission to the Cloudflare token to switch to D1."
          fi
          if npx --yes wrangler@4 deploy > ../wrangler.log 2>&1; then
            echo "url=wss://tianque-relay.$sub.workers.dev" >> $GITHUB_OUTPUT
            echo "::notice::relay deployed: wss://tianque-relay.$sub.workers.dev"
          else
            echo "::warning::relay deploy failed: $(grep -m3 -i 'error' ../wrangler.log | tr '\n' ' ' | cut -c1-300)"
            exit 1
          fi
      - run: npm run build
        env:
          ADMIN_SEED: ${{ secrets.ADMIN_SEED }}
          VITE_TQ_RELAY: ${{ steps.relay.outputs.url }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
