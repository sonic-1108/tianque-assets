name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # rebuild weekly so the admin passcode table always reaches a year ahead
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # our own relay (Cloudflare Worker) for players whose networks block peer to peer; skipped until the
      # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets exist, and a failure here never blocks the site
      - name: Deploy relay
        id: relay
        if: ${{ env.CF_TOKEN != '' }}
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain
          sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $api | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            # first time: give the account a workers.dev subdomain
            for name in tianque-$(echo $CLOUDFLARE_ACCOUNT_ID | cut -c1-6) tianque-$RANDOM$RANDOM; do
              sub=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "{\"subdomain\":\"$name\"}" $api | jq -r '.result.subdomain // empty')
              [ -n "$sub" ] && break
            done
          fi
          cd relay && npx --yes wrangler@4 deploy
          echo "url=wss://tianque-relay.$sub.workers.dev" >> $GITHUB_OUTPUT
          echo "relay: wss://tianque-relay.$sub.workers.dev"
      - run: npm run build
        env:
          ADMIN_SEED: ${{ secrets.ADMIN_SEED }}
          VITE_TQ_RELAY: ${{ steps.relay.outputs.url }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
