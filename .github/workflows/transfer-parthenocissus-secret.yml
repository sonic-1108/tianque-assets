name: Transfer Parthenocissus deployment secret
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Cloudflare token to Parthenocissus
        env:
          GH_TOKEN: ${{ secrets.PARTHENOCISSUS_REPO_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' "$CLOUDFLARE_API_TOKEN" | gh secret set CLOUDFLARE_API_TOKEN --repo sonic-1108/parthenocissus-tech
