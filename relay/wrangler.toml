# 天阙 relay: rooms for players whose networks block peer to peer. One Durable Object per room code;
# the host's messages go to every guest, each guest's to the host (the same routing the MQTT relay used).
name = "tianque-relay"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Presence"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Store"]

# The D1 database (tianque-db) is bound at deploy time by .github/workflows/deploy.yml, which creates it the
# first time and appends its [[d1_databases]] block here; without it the stats live in the Store object.
